version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: media_sequencer_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: media_sequencer_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DATABASE=media_sequencer
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - SYNC_LEAD_TIME_MS=1000
      - SEED_ON_STARTUP=true
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
